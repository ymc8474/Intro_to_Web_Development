<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JS Objects Lesson Homework</title>
  </head>
  <body>
    <h1>JS Objects Lesson Homework</h1>

    <script>
        // Step 1: Create an object called `book` with these properties:
        //   - title        (string  — pick any book you like)
        //   - author       (string)
        //   - pages        (number)
        //   - isAvailable  (boolean — set to true)
        const book = {
            title: "Goodnight Moon",
            author: "Margaret Wise Brown",
            pages: 32, 
            isAvailable: true
        };

        // Step 2: Log the title using dot notation.
        console.log(book.title);

        // Step 3: Log the author using bracket notation.
        console.log(book["author"]);

        // Step 4: Add a new property called `genre` (any genre you like).
        book.genre = "Romance"

        // Step 5: Update isAvailable to false.
        book.isAvailable = false;

        // Step 6: Add a method called `describe` that logs:
        //   "Title by Author — X pages"
        //   Use this.title, this.author, and this.pages
        book.describe = function() {
            console.log(this.title + " by " + this.author + " - " + this.pages + " pages");
        };

        // Step 7: Call book.describe()
        book.describe();

        // Step 8: Use Object.keys() to log all the property names.
        console.log(Object.keys(book));

        // Challlenge - A books property containing an array of at least 3 book objects (each with a title and author)
        const library = {
            books: [
                {title: "The Cat in the Hat", author: "Dr. Seuss"},
                {title: "Green Eggs and Ham", author: "Dr. Seuss"},
                {title: "Horton Hears a Who!", author: "Dr. Seuss"}
            ],

            listTitles() {
                this.books.forEach(function(book) {
                    console.log(book.title);
                });
            }
        };

        //Challenge - A method called listTitles() that logs the title of every book
        library.listTitles();
    </script>
  </body>
</html>
