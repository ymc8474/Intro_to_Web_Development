<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS Only Modal</title>
    <!-- Internal Stylesheet -->
    <style type="text/css">
      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
      }

      a.button {
        text-decoration: none;
        color: white;
        background-color: blueviolet;
        padding: 1rem 2rem;
        border-radius: .5rem;
        display: inline-block;
      }

      .info_modal {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        /* transpare grey bg */
        background-color: rgba(0, 0, 0, 0.3);
        /* make super super sure that t is in front of all our front other content! */
        z-index: 999999;
        /* starting state of 0% opacity */
        opacity: 0;
        /* make sure the content behind the overlay is not clickable */
        pointer-events: none;
        transition: opacity 400ms ease;
      }

      .info_modal: target {
        opacity: 1;
        pointer-events: auto;
      }

      /* the > means only direct descendants (not grandchildren) divs will be targeted */
      .info_modal > div { 
        width: 600px;
        height: 600px;
        margin: 10% auto;
        position: relative;
        padding: 2rem;
        border-radius: .75rem;
        background-color: white;
      }

      .close {
        height: 20px;
        width: 20px;
        background-color: whitesmoke; 
        color: black;
        /* ... */
      }
    </style>
  </head>
  <body>
    <!-- anchor tag targets another element on the page with a specific ID -->
     <!-- We will use CSS to make links look like buttons -->
      <a href="#info" class="button">Link to Modal 1</a>

      <!-- Being Modal 1 -->
      <!-- Parent/Wrapper div which recieves the ID that needs to be targeted -->
      <!-- This div will also be our transparent overlay -->
      <div id="info" class="info_modal center">
          <!-- this is our box within the overlay...the popup window -->
           <div>
            <a href="#" class="close">X</a> 
            <!-- transition away from modal ^ -->

            <p>Hello Modal!</p>
           </div>
      </div>
      <!-- End Modal 1 -->
  </body>
</html>
