<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Simple Navbar | Inline-Block</title>
    <!-- Internal style sheet! -->
    <style type="text/CSS">
      /* universal selector is always the frist style, 
      you want a massive rest or deefault which you 
      overwrite with more specfic styles further down */
      * {
        margin: 0;
        padding: 0;
        /* border: 2px solid red; */
      }

      body{
        font-family: 'Courier New', Courier, monospace;
      }

      ul {
        /* remove all bullet points */
        list-style-type: none;
        overflow: hidden;
        background-color: darkkhaki;
        /* 
        make the parent element's font size 0 when using inline block to get
        rid of the tiny annoying space between letters (because inline is usually for text)
        */
        font-size: 0; 
      }

      li {
        /* li disaply BLOCK by defauly. they don't want to share horizontal space with other elements */
        /* we are making these LIs disaply inline-block which allows us to size elements with a block element
        but we can also stack elements horizontally like an inline element */
        display: inline-block;
        font-size: 1rem; 
        /* 1rem: default is 16px */
        /* width: 200px; */
      }

      /* decendant selector - looks for a pattern of elements on the page */
      /* this is looking for only the anchor tags inside of a LI (list item) */
      li a {
        /* making an inline element display block will make it fill the space of the parent element */
        display: block;
        text-align: center;
        /* make it big and chunky like a button */
        width: 100px;
        padding: 10px; /* 20px 50px 1px */
        /* padding-top: 50px; if this goes above, it will be overwritten by the 10px */
        /* Remove all of that default link styling */
        color: chartreuse;
        text-decoration: none;
      }

      /* highlight the active page in the menu */
      .active {
        background-color: cornflowerblue;
      }

      /* pseudo class selector */
      li a:hover {
        background-color: cyan;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="#">Link 1</a></li>
          <li>
            <a
              class="active"
              href="#"
              >Link 2</a
            >
          </li>
          <li><a href="#">Link 3</a></li>
          <li><a href="#">Link 4</a></li>
        </ul>
      </nav>
    </header>
  </body>
</html>
